name: One-shot source migration

on:
  push:
    paths:
      - '.github/workflows/migrate-source.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Copy exact historical source bytes
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/jaredwilder/unpublished-math-papers.git /tmp/source
          mkdir -p source
          cp -R /tmp/source/caccetta-haggkvist/. source/
          rm .github/workflows/migrate-source.yml
          git config user.name "Jared Wilder release migration"
          git config user.email "jared@jaredwilder.com"
          git add -A
          git commit -m "Migrate exact Caccetta-Haggkvist source package"
          git push
